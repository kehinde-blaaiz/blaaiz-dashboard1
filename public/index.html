<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blaaiz Onboarding Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    * { box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="root">
    <!-- Loading fallback — shown until React mounts -->
    <div style="
      min-height:100vh; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      background:#f9fafb; font-family:sans-serif; gap:16px;
    ">
      <div style="
        width:40px; height:40px; border-radius:50%;
        border:4px solid #e5e7eb; border-top-color:#8b5cf6;
        animation:spin 0.8s linear infinite;
      "></div>
      <p style="font-size:14px; color:#6b7280; font-weight:600;">Loading dashboard…</p>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  </div>
  <script type="text/babel" src="./dashboard.jsx"></script>
</body>
</html>
