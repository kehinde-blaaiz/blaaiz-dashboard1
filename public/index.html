  <script>
    // Check auth before loading dashboard
    // The cookie is HttpOnly so JS can't read it directly
    // We do a quick test call to /api/asana to see if we're authenticated
    (async function() {
      try {
        const res = await fetch("/api/asana/users/me?opt_fields=gid");
        if (res.status === 401) {
          window.location.href = "/login.html";
        }
      } catch(e) {
        window.location.href = "/login.html";
      }
    })();
  </script>
